---
# Immutable action and tool pins intentionally exceed 80 columns.
# yamllint disable rule:line-length
# yamllint disable rule:truthy
name: Mission Spine AI Release Evaluation
run-name: Mission Spine AI Release Evaluation | ${{ inputs.release_id }}

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Canonical Mission Spine release identifier
        required: true
        type: string
      candidate_spec_sha256:
        description: SHA-256 of the exact canonical candidate-spec bytes
        required: true
        type: string
      ai_source_sha:
        description: Exact devpath-ai-svc source SHA from the candidate
        required: true
        type: string
      gitops_source_sha:
        description: Exact protected GitOps main SHA used for rendering
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: mission-spine-ai-release-eval-${{ inputs.release_id }}
  cancel-in-progress: false

jobs:
  release-eval:
    name: Run AI release evaluation
    environment: mission-spine-ai-release-eval
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      # devpath-evidence-reader(gitops 단독 설치, 전부 read-only)로 GitOps 읽기와
      # 조직 Members read(팀 리뷰어 증명 — 조직 수준 권한이라 레포 선택과 무관)를
      # 민팅한다. 자기 레포(devpath-ai-svc) 읽기는 github.token 이 담당한다 —
      # 레거시 org App 비밀(GITOPS_APP_ID/KEY) 의존을 제거(2026-08-22).
      - name: Mint read-only GitOps and membership token
        id: trust-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.MISSION_SPINE_EVIDENCE_READER_APP_ID }}
          private-key: ${{ secrets.MISSION_SPINE_EVIDENCE_READER_APP_PRIVATE_KEY }}
          owner: DevPathAi
          repositories: |
            devpath-gitops
          permission-actions: read
          permission-contents: read
          permission-members: read

      - name: Validate immutable dispatch identities
        shell: bash
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          CANDIDATE_SPEC_SHA256: ${{ inputs.candidate_spec_sha256 }}
          AI_SOURCE_SHA: ${{ inputs.ai_source_sha }}
          GITOPS_SOURCE_SHA: ${{ inputs.gitops_source_sha }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_ID}" =~ ^ms-[0-9]{8}-[a-z0-9][a-z0-9-]{2,40}$ ]]
          [[ "${CANDIDATE_SPEC_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${AI_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${AI_SOURCE_SHA}" != 0000000000000000000000000000000000000000
          [[ "${GITOPS_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${GITOPS_SOURCE_SHA}" != 0000000000000000000000000000000000000000
          test "${GITHUB_RUN_ATTEMPT}" = 1
          test "${GITHUB_REF}" = refs/heads/main
          test "${GITHUB_REPOSITORY}" = DevPathAi/devpath-ai-svc
          test "${GITHUB_SHA}" = "${AI_SOURCE_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Remove stale local build outputs before authentication
        shell: bash
        run: ./gradlew clean --no-build-cache

      - name: Authenticate current protected source, GitOps and human approval
        shell: bash
        env:
          # 자기 레포 읽기(런·브랜치·환경·승인·워크플로 바이트)는 github.token 으로
          # 충분하다 — et13-evidence 의 protected_approval 도구가 같은 API 를
          # github.token 으로 읽어 온 선례. 조직 팀 멤버십 조회는 auth 도구가
          # GITOPS_TOKEN(evidence-reader, members:read)으로 수행한다.
          GITHUB_TOKEN: ${{ github.token }}
          GITOPS_TOKEN: ${{ steps.trust-token.outputs.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          CANDIDATE_SPEC_SHA256: ${{ inputs.candidate_spec_sha256 }}
          GITOPS_SOURCE_SHA: ${{ inputs.gitops_source_sha }}
        run: |
          set -euo pipefail
          trust_root="${RUNNER_TEMP}/mission-spine-release-eval"
          test ! -e "${trust_root}"
          install -d -m 0700 "${trust_root}"
          node tools/mission_spine_release_eval_auth.mjs \
            --gitops-sha="${GITOPS_SOURCE_SHA}" \
            --release-id="${RELEASE_ID}" \
            --candidate-spec-sha256="${CANDIDATE_SPEC_SHA256}" \
            --candidate-output="${trust_root}/candidate-spec.json" \
            --output="${trust_root}/protected-approval.json"

      - name: Check out exact protected GitOps source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          repository: DevPathAi/devpath-gitops
          token: ${{ steps.trust-token.outputs.token }}
          ref: ${{ inputs.gitops_source_sha }}
          path: build/release-eval/gitops
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact GitOps checkout
        shell: bash
        env:
          CANDIDATE_SPEC_SHA256: ${{ inputs.candidate_spec_sha256 }}
          GITOPS_SOURCE_SHA: ${{ inputs.gitops_source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C build/release-eval/gitops rev-parse HEAD)" = "${GITOPS_SOURCE_SHA}"
          test -z "$(git -C build/release-eval/gitops status --porcelain=v1 --untracked-files=all)"
          python3 build/release-eval/gitops/scripts/release/validate_release_manifest.py \
            --manifest "${RUNNER_TEMP}/mission-spine-release-eval/candidate-spec.json" \
            --root build/release-eval/gitops \
            --expected-sha256 "${CANDIDATE_SPEC_SHA256}"

      - name: Install exact kustomize renderer
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/kustomize_v5.4.3_linux_amd64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${archive}" \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          printf '%s  %s\n' \
            3669470b454d865c8184d6bce78df05e977c9aea31c30df3c669317d43bcc7a7 \
            "${archive}" | sha256sum --check --strict
          ARCHIVE="${archive}" python3 - <<'PYTHON'
          import os
          import tarfile

          with tarfile.open(os.environ['ARCHIVE'], 'r:gz') as archive:
              members = archive.getmembers()
          if len(members) != 1:
              raise SystemExit('kustomize archive must contain exactly one member')
          member = members[0]
          if (
              member.name != 'kustomize'
              or not member.isreg()
              or member.size != 15_101_952
              or member.mode != 0o755
          ):
              raise SystemExit('kustomize archive member metadata drifted')
          PYTHON
          mkdir "${RUNNER_TEMP}/mission-spine-kustomize"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/mission-spine-kustomize"
          test -f "${RUNNER_TEMP}/mission-spine-kustomize/kustomize"
          test ! -L "${RUNNER_TEMP}/mission-spine-kustomize/kustomize"
          test "$(stat -c '%s' "${RUNNER_TEMP}/mission-spine-kustomize/kustomize")" = 15101952
          printf '%s  %s\n' \
            1d6bae90ee8591f7a4ed5b75be3f9bf80b7609f0c785921320827cd93e7c3a9a \
            "${RUNNER_TEMP}/mission-spine-kustomize/kustomize" \
            | sha256sum --check --strict
          chmod 0755 "${RUNNER_TEMP}/mission-spine-kustomize/kustomize"
          "${RUNNER_TEMP}/mission-spine-kustomize/kustomize" version \
            | grep -Fqx 'v5.4.3'

      - name: Render exact canonical GitOps configuration
        working-directory: build/release-eval/gitops
        shell: bash
        env:
          RENDERED_CONFIG: ${{ runner.temp }}/mission-spine-release-eval/rendered.yaml
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/mission-spine-kustomize/kustomize" build apps/devpath-ai-svc/base \
            > "${RENDERED_CONFIG}"
          python3 - <<'PYTHON'
          import os
          from pathlib import Path

          path = Path(os.environ['RENDERED_CONFIG'])
          raw = path.read_bytes()
          if not raw or b'\r' in raw or not raw.endswith(b'\n'):
              raise SystemExit('rendered config is not canonical LF output')
          if raw.decode('utf-8').encode('utf-8') != raw:
              raise SystemExit('rendered config is not canonical UTF-8')
          PYTHON

      - name: Build and test exact ET9 release inputs without provider calls
        shell: bash
        run: >-
          ./gradlew test --tests 'ai.devpath.aigw.mentor.eval.*'
          mentorReleaseArtifactFunctionalTest prepareMentorReleaseArtifacts
          writeMentorCurrentRuntimeDependencyGraph
          -DimmutableSharedContract=true --no-build-cache
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Prepare pinned loopback-only Ollama evaluator
        shell: bash
        env:
          OLLAMA_IMAGE: ollama/ollama:0.32.5@sha256:98c19ced6600f2924e80b92d701cd867d8f7ef0c4dde516c619484e31e47f103
          OLLAMA_MODEL: qwen2.5:3b
          EXPECTED_OLLAMA_MODEL_DIGEST: 357c53fb659c5076de1d65ccb0b397446227b71a42be9d1603d46168015c9e4b
        run: |
          set -euo pipefail
          trust_root="${RUNNER_TEMP}/mission-spine-release-eval"
          test -d "${trust_root}"
          docker run --detach --name mission-spine-eval-ollama \
            --publish 127.0.0.1:11434:11434 \
            "${OLLAMA_IMAGE}" >/dev/null
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error \
                http://127.0.0.1:11434/api/tags >"${trust_root}/ollama-tags.json"; then
              break
            fi
            sleep 2
          done
          jq -e '.models | type == "array"' "${trust_root}/ollama-tags.json" >/dev/null
          docker exec mission-spine-eval-ollama ollama pull "${OLLAMA_MODEL}"
          curl --fail --silent --show-error \
            http://127.0.0.1:11434/api/tags >"${trust_root}/ollama-tags.json"
          actual_model_digest="$(jq -er --arg model "${OLLAMA_MODEL}" '
            [.models[] | select(.name == $model)]
            | if length == 1 then .[0].digest else error("model identity drifted") end
          ' "${trust_root}/ollama-tags.json")"
          test "${actual_model_digest}" = "${EXPECTED_OLLAMA_MODEL_DIGEST}"

          openssl req -x509 -newkey rsa:3072 -sha256 -days 1 -nodes \
            -keyout "${trust_root}/ollama-proxy.key" \
            -out "${trust_root}/ollama-proxy.crt" \
            -subj '/CN=127.0.0.1' \
            -addext 'subjectAltName=IP:127.0.0.1' \
            -addext 'keyUsage=critical,digitalSignature,keyEncipherment' \
            -addext 'extendedKeyUsage=serverAuth' >/dev/null 2>&1
          chmod 0600 "${trust_root}/ollama-proxy.key"
          cp "${JAVA_HOME}/lib/security/cacerts" \
            "${trust_root}/mentor-eval-cacerts"
          set +e
          keytool -importcert -noprompt \
            -alias mission-spine-ollama-loopback \
            -file "${trust_root}/ollama-proxy.crt" \
            -keystore "${trust_root}/mentor-eval-cacerts" \
            -storepass changeit >/dev/null
          keytool_import_status=$?
          set -e
          if [[ "${keytool_import_status}" -ne 0 ]]; then
            echo 'keytool import returned non-zero; verifying exact truststore state' >&2
          fi
          source_certificate_sha256="$(openssl x509 \
            -in "${trust_root}/ollama-proxy.crt" -outform DER \
            | sha256sum | awk '{print $1}')"
          truststore_certificate_sha256="$(keytool -exportcert \
            -alias mission-spine-ollama-loopback \
            -keystore "${trust_root}/mentor-eval-cacerts" \
            -storepass changeit \
            | sha256sum | awk '{print $1}')"
          test "${truststore_certificate_sha256}" = "${source_certificate_sha256}"
          RUNNER_TRACKING_ID= nohup python3 tools/ollama_tls_proxy.py \
            --host 127.0.0.1 \
            --port 11435 \
            --upstream-host 127.0.0.1 \
            --upstream-port 11434 \
            --certificate "${trust_root}/ollama-proxy.crt" \
            --private-key "${trust_root}/ollama-proxy.key" \
            >"${trust_root}/ollama-proxy.log" 2>&1 &
          echo "$!" >"${trust_root}/ollama-proxy.pid"
          tls_ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error \
                --cacert "${trust_root}/ollama-proxy.crt" \
                https://127.0.0.1:11435/api/tags \
                >"${trust_root}/ollama-tls-tags.json"; then
              actual_tls_model_digest="$(jq -er --arg model "${OLLAMA_MODEL}" '
                [.models[] | select(.name == $model)]
                | if length == 1 then .[0].digest else error("model identity drifted") end
              ' "${trust_root}/ollama-tls-tags.json")" || actual_tls_model_digest=''
              if [[ "${actual_tls_model_digest}" = "${EXPECTED_OLLAMA_MODEL_DIGEST}" ]]; then
                tls_ready=true
                break
              fi
            fi
            if ! kill -0 "$(cat "${trust_root}/ollama-proxy.pid")" 2>/dev/null; then
              echo 'Ollama TLS proxy exited before semantic readiness' >&2
              exit 1
            fi
            sleep 1
          done
          test "${tls_ready}" = true

      - name: Run live ET9 evaluation and create sanitized evidence
        shell: bash
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
          MENTOR_EVAL_RELEASE_ID: ${{ inputs.release_id }}
          MENTOR_EVAL_SOURCE_REVISION: ${{ inputs.ai_source_sha }}
          MENTOR_EVAL_GITOPS_REVISION: ${{ inputs.gitops_source_sha }}
          MENTOR_EVAL_RENDERED_CONFIG: ${{ runner.temp }}/mission-spine-release-eval/rendered.yaml
          MENTOR_EVAL_MANIFEST: ${{ github.workspace }}/build/release-eval/mentor-release-eval-manifest-v3.json
          MENTOR_EVAL_EVIDENCE: ${{ github.workspace }}/build/release-eval/mentor-release-eval-evidence-v3.json
          MENTOR_EVAL_BOOT_JAR: ${{ github.workspace }}/build/release-inputs/devpath-ai-svc-0.0.1-SNAPSHOT.jar
          MENTOR_EVAL_SHARED_ARTIFACT: ${{ github.workspace }}/build/release-inputs/devpath-shared-0.0.1-et9.20260816.jar
          MENTOR_EVAL_DEPENDENCY_GRAPH: ${{ github.workspace }}/build/release-inputs/runtime-dependency-graph.txt
          MENTOR_EVAL_CURRENT_DEPENDENCY_GRAPH: ${{ github.workspace }}/build/release-eval/current-runtime-dependency-graph.txt
          MENTOR_EVAL_BOOT_LIBRARY_GRAPH: ${{ github.workspace }}/build/release-inputs/boot-library-graph.txt
          MENTOR_EVAL_GRADLE_PROPERTIES: ${{ github.workspace }}/gradle.properties
          MENTOR_EVAL_OLLAMA_BASE_URL: https://127.0.0.1:11435
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JAVA_TOOL_OPTIONS: >-
            -Djavax.net.ssl.trustStore=${{ runner.temp }}/mission-spine-release-eval/mentor-eval-cacerts
            -Djavax.net.ssl.trustStorePassword=changeit
          MISSION_SPINE_CANDIDATE_SPEC_SHA256: ${{ inputs.candidate_spec_sha256 }}
          MISSION_SPINE_CANDIDATE: ${{ runner.temp }}/mission-spine-release-eval/candidate-spec.json
          MISSION_SPINE_AI_SOURCE_SHA: ${{ inputs.ai_source_sha }}
          MISSION_SPINE_GITOPS_SOURCE_SHA: ${{ inputs.gitops_source_sha }}
          MISSION_SPINE_APPROVAL: ${{ runner.temp }}/mission-spine-release-eval/protected-approval.json
          MISSION_SPINE_RELEASE_EVIDENCE: ${{ github.workspace }}/build/release-eval/stage/evidence.json
        run: |
          set -euo pipefail
          mkdir -p build/release-eval/stage
          ./gradlew generateMentorReleaseEvalManifest --no-build-cache
          ./gradlew validateMissionSpineReleaseEvalCandidate --no-build-cache
          ./gradlew test -Dgroups=eval \
            --tests ai.devpath.aigw.mentor.eval.GoldenMentorInjectionEvalTest \
            --no-build-cache --rerun-tasks
          ./gradlew verifyMentorReleaseEvalEvidence --no-build-cache
          ./gradlew generateMissionSpineReleaseEvalEvidence --no-build-cache
          ./gradlew validateMissionSpineReleaseEvalEvidence --no-build-cache
          jq -er '.ollama_endpoint_sha256 | test("^[0-9a-f]{64}$")' \
            build/release-eval/stage/evidence.json > /dev/null
          mapfile -t files < <(
            find build/release-eval/stage -type f -printf '%P\n' | LC_ALL=C sort
          )
          test "${#files[@]}" -eq 1
          test "${files[0]}" = evidence.json
          test -z "$(find build/release-eval/stage -type l -print -quit)"

      - name: Upload exact sanitized release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ inputs.release_id }}-ai-eval-run-${{ github.run_id }}-attempt-1
          path: build/release-eval/stage/evidence.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
