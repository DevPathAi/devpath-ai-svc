name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: devpath
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: devpath
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: >-
          ./gradlew clean build prepareMentorReleaseArtifacts
          -DimmutableSharedContract=true
        env:
          DB_URL: jdbc:postgresql://localhost:5432/devpath
          DB_USER: devpath
          DB_PASSWORD: localdev
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish exact release inputs
        uses: actions/upload-artifact@v4
        with:
          name: mentor-release-inputs-${{ github.sha }}
          path: build/release-inputs/*
          if-no-files-found: error
          retention-days: 1

  release-model-eval:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      gitops-revision: ${{ steps.gitops-revision.outputs.sha }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Download exact build inputs
        uses: actions/download-artifact@v4
        with:
          name: mentor-release-inputs-${{ github.sha }}
          path: build/evaluated-release-inputs
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: DevPathAi
          repositories: devpath-gitops
      - uses: actions/checkout@v6
        with:
          repository: DevPathAi/devpath-gitops
          token: ${{ steps.app-token.outputs.token }}
          path: gitops
          ref: main
          fetch-depth: 1
      - name: Install kustomize
        run: |
          curl -sLo kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar -xzf kustomize.tar.gz && sudo mv kustomize /usr/local/bin/
      - name: Bind exact GitOps revision
        id: gitops-revision
        run: echo "sha=$(git -C gitops rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Render production Mentor configuration
        run: |
          mkdir -p build/release-eval
          kustomize build gitops/apps/devpath-ai-svc/base -o build/release-eval/rendered.yaml
      - name: Generate immutable release evaluation manifest
        run: |
          ./gradlew writeMentorCurrentRuntimeDependencyGraph --no-build-cache
          ./gradlew generateMentorReleaseEvalManifest --no-build-cache
        env: &mentor-eval-env
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MENTOR_EVAL_RELEASE_ID: devpath-ai-${{ github.sha }}
          MENTOR_EVAL_SOURCE_REVISION: ${{ github.sha }}
          MENTOR_EVAL_GITOPS_REVISION: ${{ steps.gitops-revision.outputs.sha }}
          MENTOR_EVAL_RENDERED_CONFIG: ${{ github.workspace }}/build/release-eval/rendered.yaml
          MENTOR_EVAL_MANIFEST: ${{ github.workspace }}/build/release-eval/mentor-release-eval-manifest-v3.json
          MENTOR_EVAL_EVIDENCE: ${{ github.workspace }}/build/release-eval/mentor-release-eval-evidence-v3.json
          MENTOR_EVAL_BOOT_JAR: ${{ github.workspace }}/build/evaluated-release-inputs/devpath-ai-svc-0.0.1-SNAPSHOT.jar
          MENTOR_EVAL_SHARED_ARTIFACT: ${{ github.workspace }}/build/evaluated-release-inputs/devpath-shared-0.0.1-et9.20260816.jar
          MENTOR_EVAL_DEPENDENCY_GRAPH: ${{ github.workspace }}/build/evaluated-release-inputs/runtime-dependency-graph.txt
          MENTOR_EVAL_CURRENT_DEPENDENCY_GRAPH: ${{ github.workspace }}/build/release-eval/current-runtime-dependency-graph.txt
          MENTOR_EVAL_BOOT_LIBRARY_GRAPH: ${{ github.workspace }}/build/evaluated-release-inputs/boot-library-graph.txt
          MENTOR_EVAL_GRADLE_PROPERTIES: ${{ github.workspace }}/gradle.properties
          MENTOR_EVAL_OLLAMA_BASE_URL: ${{ vars.MENTOR_EVAL_OLLAMA_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Evaluate both manifest models
        run: >-
          ./gradlew test -Dgroups=eval
          --tests ai.devpath.aigw.mentor.eval.GoldenMentorInjectionEvalTest
          --no-build-cache --rerun-tasks
        env: *mentor-eval-env
      - name: Validate fresh release evidence
        run: ./gradlew verifyMentorReleaseEvalEvidence --no-build-cache
        env: *mentor-eval-env
      - name: Publish release evaluation evidence
        uses: actions/upload-artifact@v4
        with:
          name: mentor-release-eval-${{ github.sha }}
          path: |
            build/release-eval/mentor-release-eval-manifest-v3.json
            build/release-eval/mentor-release-eval-evidence-v3.json
          if-no-files-found: error
          retention-days: 90

  image:
    needs: [build, release-model-eval]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Download evaluated bootJar
        uses: actions/download-artifact@v4
        with:
          name: mentor-release-inputs-${{ github.sha }}
          path: build/libs
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/devpathai/devpath-ai-svc:${{ github.sha }}
            ghcr.io/devpathai/devpath-ai-svc:main

  deploy:
    needs: [image, release-model-eval]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: source
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: DevPathAi
          repositories: devpath-gitops
      - uses: actions/checkout@v6
        with:
          repository: DevPathAi/devpath-gitops
          token: ${{ steps.app-token.outputs.token }}
          path: gitops
          ref: main
          fetch-depth: 0
      - name: Verify evaluated GitOps revision is still current
        working-directory: gitops
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "${{ needs.release-model-eval.outputs.gitops-revision }}"
          test "$(git rev-parse refs/remotes/origin/main)" = "${{ needs.release-model-eval.outputs.gitops-revision }}"
      - name: Install kustomize
        run: |
          curl -sLo kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar -xzf kustomize.tar.gz && sudo mv kustomize /usr/local/bin/
      - name: set image to commit SHA
        working-directory: gitops/apps/devpath-ai-svc/base
        run: kustomize edit set image ghcr.io/devpathai/devpath-ai-svc=ghcr.io/devpathai/devpath-ai-svc:${{ github.sha }}
      - name: commit & push
        working-directory: gitops
        run: |
          git config user.name "devpath-gitops-bot[bot]"
          git config user.email "devpath-gitops-bot[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            bash ../source/.github/scripts/push-evaluated-gitops.sh \
              "${{ needs.release-model-eval.outputs.gitops-revision }}" verify-only
            exit 0
          fi
          git commit -m "deploy(devpath-ai-svc): ${{ github.sha }}"
          bash ../source/.github/scripts/push-evaluated-gitops.sh \
            "${{ needs.release-model-eval.outputs.gitops-revision }}"
