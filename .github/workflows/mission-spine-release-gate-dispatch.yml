---
name: Mission Spine Release Gate Dispatch

'on':
  push:
    branches:
      - automation/dispatch-ms-20261003-ai-fallback-retry-budget

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch protected AI release evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch AI evaluation as GitHub Actions automation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/mission-spine-release-eval.yml/dispatches" \
            --input - <<'JSON'
          {
            "ref": "main",
            "inputs": {
              "release_id": "ms-20261003-ai-fallback-retry-budget",
              "candidate_spec_sha256": "c23f3b8e1c1dfceb8c87e347a192c94b706d33c968624cd8dce06126ef94a3e1",
              "ai_source_sha": "c5614621d0076ced0342353c8dd211a0c0a46cff",
              "gitops_source_sha": "a97a175466962e33ca1823edbb6656091700db81"
            }
          }
          JSON
