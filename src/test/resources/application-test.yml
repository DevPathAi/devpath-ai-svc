spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/devpath}
    username: ${DB_USER:devpath}
    password: ${DB_PASSWORD:localdev}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 다수의 @SpringBootTest 컨텍스트가 컨텍스트 캐시에 상주하며 각자 풀을 열어
      # Postgres max_connections(100)를 넘겨 "too many clients"(53300)가 간헐 발생.
      # 테스트에선 컨텍스트당 소수 커넥션으로 충분 → 총 커넥션 수를 낮춰 방지.
      maximum-pool-size: 4
  flyway:
    enabled: true
    locations: classpath:db/migration
    postgresql:
      # V202608161002 creates indexes concurrently outside a transaction.
      # A transactional advisory lock would wait on its own Flyway connection.
      transactional-lock: false
  jpa:
    hibernate:
      ddl-auto: none

devpath:
  auth:
    internal-token: test-internal-token
  review:
    provider: mock
