spring:
  application:
    name: devpath-ai-svc
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/devpath}
    username: ${DB_USER:devpath}
    password: ${DB_PASSWORD:localdev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: devpath-ai-review
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  task:
    scheduling:
      pool:
        # @Scheduled 3개(outbox relay 2초 · 래치 복구 탐색 · Ollama 생존 탐색)가 서로를 기다리지 않게 한다.
        # 기본 1이면 응답 없는 Ollama 를 탐색하는 동안(최대 3×(3초+5초)) outbox 발행이 멈춘다.
        size: 3

server:
  port: 8080

devpath:
  release:
    enabled: ${MISSION_RELEASE_CONTROL_ENABLED:false}
  auth:
    jwt-secret: ${JWT_SECRET:test-secret-please-change-min-32-bytes-long-0123456789}
    internal-token: ${INTERNAL_API_TOKEN:}
  sandbox:
    base-url: ${SANDBOX_URI:http://localhost:8085}
    timeout: ${SANDBOX_TIMEOUT:PT5S}
  review:
    provider: ${REVIEW_PROVIDER:mock}
    fallback: ${REVIEW_FALLBACK:}
    # Must exceed the longest configured provider timeout. Expiry recovers a crashed worker.
    processing-lease: ${REVIEW_PROCESSING_LEASE:PT5M}
    ollama-model: ${REVIEW_OLLAMA_MODEL:qwen2.5-coder:7b}
    # 이 기능의 Ollama 만 다른 주소(예: GPU 노드)로 보낼 수 있다. 값을 주지 않으면 공용 base-url 을 쓴다.
    # devpath.ollama.path-base-url 과 같은 패턴이다 — 여기에 등록하지 않으면 환경 변수가 조용히 무시된다.
    ollama-base-url: ${REVIEW_OLLAMA_BASE_URL:${devpath.ollama.base-url}}
    # 연결만 짧게 끊는다 — GPU 노드가 갑자기 사라졌을 때 요청마다 60초를 기다리지 않게(스펙 2026-10-03 §3.1-6).
    ollama-connect-timeout: ${REVIEW_OLLAMA_CONNECT_TIMEOUT:PT3S}
    claude-model: ${REVIEW_CLAUDE_MODEL:claude-sonnet-4-6}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    # 학습경로 생성만 다른 Ollama(GPU 노드)로 보낼 수 있다. 값을 주지 않으면 base-url 을 그대로 쓴다.
    # 여기에 등록하지 않으면 OLLAMA_PATH_* 환경 변수는 조용히 무시된다(2026-08-17 실측: 8.1초에 503).
    path-base-url: ${OLLAMA_PATH_BASE_URL:${devpath.ollama.base-url}}
    gen-model: ${OLLAMA_GEN_MODEL:qwen2.5:7b}
    embed-model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}
    timeout: ${OLLAMA_TIMEOUT:PT8S}
    # 생성은 분 단위다. embed(2초)와 같은 값을 쓰면 장애 감지가 그만큼 늦어지므로 따로 둔다.
    path-timeout: ${OLLAMA_PATH_TIMEOUT:${devpath.ollama.timeout}}
  mentor:
    provider: ${MENTOR_PROVIDER:mock}
    fallback: ${MENTOR_FALLBACK:}
    claude-base-url: ${MENTOR_CLAUDE_BASE_URL:https://api.anthropic.com}
    claude-model: ${MENTOR_CLAUDE_MODEL:claude-sonnet-4-6}
    ollama-model: ${MENTOR_OLLAMA_MODEL:qwen2.5:7b}
    enabled: ${MENTOR_ENABLED:true}
    provider-timeout: ${MENTOR_PROVIDER_TIMEOUT:PT50S}
    request-timeout: ${MENTOR_REQUEST_TIMEOUT:PT55S}
    sse-timeout: ${MENTOR_SSE_TIMEOUT:PT60S}
    heartbeat-interval: ${MENTOR_HEARTBEAT_INTERVAL:PT15S}
  lcs:
    base-url: ${LCS_URI:http://localhost:8087}
    timeout: ${LCS_TIMEOUT:PT2S}
  community-seed:
    provider: ${COMMUNITY_SEED_PROVIDER:mock}
    fallback: ${COMMUNITY_SEED_FALLBACK:}
    claude-model: ${COMMUNITY_SEED_CLAUDE_MODEL:claude-haiku-4-5}
    ollama-model: ${COMMUNITY_SEED_OLLAMA_MODEL:qwen2.5:7b}
    # review 의 ollama-base-url 과 같은 규칙. 미지정이면 공용 base-url.
    ollama-base-url: ${COMMUNITY_SEED_OLLAMA_BASE_URL:${devpath.ollama.base-url}}
    # 연결만 짧게 끊는다 — GPU 노드가 갑자기 사라졌을 때 요청마다 60초를 기다리지 않게(스펙 2026-10-03 §3.1-6).
    ollama-connect-timeout: ${COMMUNITY_SEED_OLLAMA_CONNECT_TIMEOUT:PT3S}
    enabled: ${COMMUNITY_SEED_ENABLED:true}
  learning:
    # 게이트웨이 미경유 내부 호출. 실제 주소는 LEARNING_URI로 주입(learning-svc server.port=8080 실측).
    # 로컬 단위/IT는 MockWebServer라 기본값 무관.
    base-url: ${LEARNING_URI:http://localhost:8081}
    timeout: ${LEARNING_TIMEOUT:PT5S}
  retention:
    provider: ${RETENTION_PROVIDER:mock}
    fallback: ${RETENTION_FALLBACK:}
    ollama-model: ${RETENTION_OLLAMA_MODEL:qwen2.5:7b}
    # review 의 ollama-base-url 과 같은 규칙. 미지정이면 공용 base-url.
    ollama-base-url: ${RETENTION_OLLAMA_BASE_URL:${devpath.ollama.base-url}}
    # 연결만 짧게 끊는다 — GPU 노드가 갑자기 사라졌을 때 요청마다 60초를 기다리지 않게(스펙 2026-10-03 §3.1-6).
    ollama-connect-timeout: ${RETENTION_OLLAMA_CONNECT_TIMEOUT:PT3S}
    claude-model: ${RETENTION_CLAUDE_MODEL:claude-sonnet-4-6}
    enabled: ${RETENTION_ENABLED:true}
  provider:
    # 기한이 지난 래치를 배경에서 탐색하는 주기. 사용자 요청은 탐색에 쓰지 않는다(스펙 §3.1).
    probe-interval: ${PROVIDER_PROBE_INTERVAL:PT1M}
    # 폴백 자리 Ollama 의 생존 탐색 주기. 래치가 닫혀 있어도 핑해 죽은 폴백을 요청 전에 막는다(스펙 2026-10-03 §3.1-5).
    liveness-interval: ${PROVIDER_LIVENESS_INTERVAL:PT30S}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
